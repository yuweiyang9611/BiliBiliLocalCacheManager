name: promote-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version tag to promote, for example v0.4.0
        required: true
        type: string
      acceptance_record:
        description: Committed JSON record under docs/acceptance/
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      ACCEPTANCE_RECORD: ${{ inputs.acceptance_record }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate promotion request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ACCEPTANCE_RECORD" =~ ^docs/acceptance/[A-Za-z0-9._-]+\.json$ ]]
          test ! -L "$ACCEPTANCE_RECORD"
          git ls-files --error-unmatch -- "$ACCEPTANCE_RECORD"
          git cat-file -e "HEAD:$ACCEPTANCE_RECORD"
          tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          echo "TAG_COMMIT=$tag_commit" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName,assets > release-state.json
          node -e 'const r=require("./release-state.json"); if(r.isDraft || !r.isPrerelease || r.tagName!==process.env.RELEASE_TAG) process.exit(1)'
      - name: Download and validate the tested packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir candidate
          gh release download "$RELEASE_TAG" --dir candidate
          node --test scripts/validate-desktop-acceptance.test.mjs
          node scripts/validate-desktop-acceptance.mjs "$ACCEPTANCE_RECORD" candidate "$RELEASE_TAG" "$TAG_COMMIT"
      - name: Attach evidence and promote without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName,assets > release-state-current.json
          node -e 'const a=require("./release-state.json"),b=require("./release-state-current.json"); if(JSON.stringify(a)!==JSON.stringify(b)) throw Error("Release changed during validation")'
          cp "$ACCEPTANCE_RECORD" desktop-acceptance.json
          gh release upload "$RELEASE_TAG" desktop-acceptance.json --clobber
          gh release edit "$RELEASE_TAG" --prerelease=false --latest
