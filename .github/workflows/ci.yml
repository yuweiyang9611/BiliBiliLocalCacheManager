name: ci

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  commit-email-privacy:
    name: commit-email-privacy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit email privacy
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu

          zero_oid="0000000000000000000000000000000000000000"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ "$BEFORE_SHA" = "$zero_oid" ]; then
            range="$AFTER_SHA"
          else
            range="$BEFORE_SHA..$AFTER_SHA"
          fi

          failed=0
          for commit_oid in $(git rev-list "$range"); do
            author_email="$(git show -s --format=%ae "$commit_oid")"
            committer_email="$(git show -s --format=%ce "$commit_oid")"

            case "$author_email" in
              noreply@github.com|*@users.noreply.github.com) ;;
              *)
                echo "::error::Commit $commit_oid uses a non-noreply author email."
                failed=1
                ;;
            esac

            case "$committer_email" in
              noreply@github.com|*@users.noreply.github.com) ;;
              *)
                echo "::error::Commit $commit_oid uses a non-noreply committer email."
                failed=1
                ;;
            esac
          done

          exit "$failed"

  build-test-publish:
    needs: commit-email-privacy
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.3xx

      - name: Restore
        run: dotnet restore BiliBiliLocalCacheManager.slnx

      - name: Build
        run: dotnet build BiliBiliLocalCacheManager.slnx --configuration Release --no-restore --nologo

      - name: Test non-UI suites
        run: dotnet test BiliBiliLocalCacheManager.slnx --configuration Release --no-build --nologo --filter "Category!=UI&Category!=FFmpegIntegration"

      - name: Cache pinned FFmpeg
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/ffmpeg
            ~/AppData/Local/BiliBiliLocalCacheManager/ffmpeg
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('ffmpeg-bundle.json') }}

      - name: Prepare manifest-pinned FFmpeg archive
        shell: pwsh
        run: ./scripts/prepare-ffmpeg-integration.ps1 -EnvironmentFile $env:GITHUB_ENV

      - name: Test real FFmpeg integration
        env:
          BILIBILI_RUN_FFMPEG_INTEGRATION_TESTS: "1"
        run: dotnet test BiliBiliLocalCacheManager.Playback.Tests/BiliBiliLocalCacheManager.Playback.Tests.csproj --configuration Release --no-build --nologo --filter "Category=FFmpegIntegration"

      - name: Publish CLI
        run: dotnet publish BiliBiliLocalCacheManager.Cli/BiliBiliLocalCacheManager.Cli.csproj --configuration Release --no-build --output artifacts/cli

      - name: Publish WPF
        run: dotnet publish BiliBiliLocalCacheManager.Wpf/BiliBiliLocalCacheManager.Wpf.csproj --configuration Release --no-build --output artifacts/wpf

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliBiliLocalCacheManager-cli-framework-dependent
          path: artifacts/cli

      - name: Upload WPF artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliBiliLocalCacheManager-wpf-framework-dependent
          path: artifacts/wpf
